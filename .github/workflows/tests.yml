name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the python constraint in pyproject.toml ("^3.9,<3.13")
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # NOTE: This installs only the runtime dependencies actually imported by
      # the modules under test in tests/, rather than running a full
      # `poetry install`. The full dependency set in pyproject.toml includes
      # heavy/optional packages (transformers, pytesseract, pdf2image,
      # googletrans) that aren't needed for this unit-test suite and would
      # slow CI down and add unrelated failure modes (system libs like
      # poppler/tesseract, dependency conflicts between googletrans and
      # openai's httpx pin). Tests that need network-backed services
      # (translation APIs, tiktoken's remote vocab download, live LLM calls)
      # are intentionally mocked in tests/ so this suite stays fast and
      # deterministic. Revisit this if/when the full dependency set is
      # pruned (see FIXES.md).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy python-dotenv openai tiktoken langdetect nltk PyPDF2 requests beautifulsoup4 urllib3

      - name: Run unit tests
        run: pytest -v
